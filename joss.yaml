name: joss_ai
version: 2.0.8
description: Plugin oficial para integración con Inteligencia Artificial (AI y ChatClient) en Joss.
repository: https://github.com/joss-language/joss_ai
license: MIT
type: joss
environment:
  joss: ">=3.6.7"
entry:
  main: src/plugin.joss
commands:
  ai:activate:
    description: "Configura proveedores y modelos de Inteligencia Artificial (Groq, OpenAI, Gemini)"
    usage: "joss ai:activate"
    protected: true
