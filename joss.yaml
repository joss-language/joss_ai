  linux-amd64: https://github.com/joss-language/joss_ai/releases/download/v2.0.3/joss_ai-linux-amd64
  linux-arm64: https://github.com/joss-language/joss_ai/releases/download/v2.0.3/joss_ai-linux-arm64
  darwin-amd64: https://github.com/joss-language/joss_ai/releases/download/v2.0.3/joss_ai-darwin-amd64
